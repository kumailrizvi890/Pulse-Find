# Minimal Supabase CLI config. Only the settings Pulse Find depends on are listed.
project_id = "pulse-find"

[functions.mcp]
# The MCP server checks its own personal access tokens (pf_...), not Supabase JWTs.
verify_jwt = false

[functions.refresh-jobs]
verify_jwt = true
[functions.sync-trigger]
# pg_cron calls this with the project's anon key, like refresh-jobs.
verify_jwt = true
